apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: echo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
      - name: echo
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: echo-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-html
  namespace: echo
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <body style="font-family:monospace;background:#1e1e2e;color:#cdd6f4;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
      <div style="text-align:center">
        <h1 style="color:#89b4fa">practice-dev</h1>
        <p>LBC ✓ &nbsp; external-dns ✓ &nbsp; cert-manager ✓ &nbsp; external-secrets ✓</p>
        <p style="color:#6c7086">lab.trdevops.com.br</p>
      </div>
    </body>
    </html>
